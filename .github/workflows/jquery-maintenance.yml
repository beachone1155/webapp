name: jQuery maintenance repair
on:
  push:
    branches: [fix/jquery-security-20261006]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact repair revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/jquery-security-20261006
          git clone --quiet https://github.com/beachone1155/webapp.git source
          git -C source checkout --quiet "$GITHUB_SHA"
      - name: Confirm the guard rejects the vulnerable baseline
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/check_jquery.py; then
            echo 'Expected the pre-fix dependency check to fail' >&2
            exit 1
          fi
          echo 'PASS: regression guard rejects the vulnerable baseline'
      - name: Replace only dependency bytes and remove superseded libraries
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          root = pathlib.Path('.').resolve()
          samples = root / 'smartphonegame'
          def download(url):
              with urllib.request.urlopen(url, timeout=30) as response:
                  return response.read()
          data = download('https://code.jquery.com/jquery-3.7.1.min.js')
          digest = base64.b64encode(hashlib.sha256(data).digest()).decode()
          assert digest == '/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=', digest
          with tarfile.open(fileobj=io.BytesIO(download('https://registry.npmjs.org/jquery/-/jquery-3.7.1.tgz')), mode='r:gz') as package:
              assert json.load(package.extractfile('package/package.json'))['version'] == '3.7.1'
              assert package.extractfile('package/dist/jquery.min.js').read() == data, 'CDN and npm files differ'
              license_data = package.extractfile('package/LICENSE.txt').read()
          vendor = samples / 'vendor/jquery-3.7.1.min.js'
          vendor.parent.mkdir(exist_ok=True)
          vendor.write_bytes(data)
          (vendor.parent / 'jquery-LICENSE.txt').write_bytes(license_data)
          old_sources = [b'http://code.jquery.com/jquery-1.8.2.min.js', b'http://ajax.googleapis.com/ajax/libs/jquery/1.6.1/jquery.min.js']
          changed = []
          for path in sorted(samples.rglob('*.html')):
              original = path.read_bytes()
              updated = original
              relative = os.path.relpath(vendor, path.parent).encode('ascii')
              for old in old_sources:
                  updated = updated.replace(old, relative)
              if path == samples / 'ch5/1-appcahce/takarabako-game.html':
                  updated = updated.replace(b'jquery-1.8.2.min.js', relative)
              if updated != original:
                  path.write_bytes(updated)
                  changed.append(str(path.relative_to(root)))
          assert len(changed) == 14, changed
          manifest = samples / 'ch5/1-appcahce/takarabako-game.appcache'
          original = manifest.read_bytes()
          assert original.count(b'jquery-1.7.2.min.js') == 1
          assert original.count(b'# Version.1.000') == 1
          manifest.write_bytes(original.replace(b'jquery-1.7.2.min.js', b'../../vendor/jquery-3.7.1.min.js').replace(b'# Version.1.000', b'# Version.1.001'))
          for version in ('1.7.2', '1.8.2'):
              (samples / ('ch5/1-appcahce/jquery-' + version + '.min.js')).unlink()
          print('OFFICIAL_CDN_AND_NPM_IDENTICAL', len(data), 'sha256-' + digest)
          print('UPDATED_HTML', json.dumps(changed))
          print('PASS: original HTML encodings and all bytes other than dependency references preserved')
          PY
          python3 scripts/check_jquery.py
          git diff --check
      - name: Install isolated browser test tooling
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false agent-browser@0.33.2
          echo "$RUNNER_TEMP/browser-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run Chrome smoke tests before publishing the repair
        working-directory: source
        run: python3 scripts/smoke_jquery.py
      - name: Commit tested dependency changes to the repair branch only
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/jquery-security-20261006
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smartphonegame
          git diff --cached --stat
          git commit -m 'fix(security): consolidate legacy jQuery on verified 3.7.1'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/jquery-security-20261006
          echo "TESTED_REPAIR_COMMIT=$(git rev-parse HEAD)"
