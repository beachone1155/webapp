name: jQuery security checks
on:
  push:
    branches: [master, fix/jquery-security-20261006]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: jquery-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision without persisted credentials
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin https://github.com/beachone1155/webapp.git
          git -C source fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --quiet --detach FETCH_HEAD
      - name: Check dependency versions, hashes and local references
        working-directory: source
        run: python3 scripts/check_jquery.py
      - name: Set up Node.js 24 for browser test tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install isolated browser test tooling
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false agent-browser@0.33.2
          echo "$RUNNER_TEMP/browser-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify all jQuery loads and representative interactions in Chrome
        working-directory: source
        run: python3 scripts/smoke_jquery.py
  verify-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the revision being verified
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin https://github.com/beachone1155/webapp.git
          git -C source fetch --quiet --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --quiet --detach FETCH_HEAD
      - name: Verify deployed bytes and removal of the old libraries
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_pages.py
